# Konfigurasi runtime: sumber kamera, backend inferensi, keluaran alert.
# Fase 2 (Jetson): ganti cabin.source.type ke "gstreamer", backend ke "tensorrt", alert ke "gpio", sink ke MQTT Minerva.

device_id: laptop-dev
event_id_prefix: laptop
timezone_offset_h: 7        # WIB, untuk tanggal di event_id

cabin:
  source:
    type: webcam            # webcam | file | url | gstreamer
    index: 0
    path: null              # untuk type=file
    url: null               # untuk type=url (aplikasi IP camera di HP)
    pipeline: null          # untuk type=gstreamer (Jetson)
    width: 640
    height: 480
    fps: 30
    realtime: true          # file: putar sesuai timestamp asli (replay = live)
    api: auto               # webcam backend OpenCV: auto | dshow | msmf | v4l2
  simulate_nir: false       # grayscale 3 channel + CLAHE (aturan kerja 7)
  clahe_clip: 2.0
  clahe_tile: 8
  roi: null                 # [x, y, w, h] relatif 0..1 (crop kursi pengemudi); null = full frame
  # Uji live 2026-11-14: frame gelap saat webcam baru menyala (mean ~13) -> D-09 palsu di detik 3.
  # Indikator tetap dihitung, tapi tidak ada alert selama sekian detik pertama sumber kamera.
  startup_grace_s: 3.0
  # Simulasi kamera target dari kamera HP/webcam (configs/camera_profiles.yaml, docs/PHONE_CAMERA_TEST.md).
  # null = tanpa simulasi. Contoh: imx219_77ir, imx219_77ir+forklift. CLI --camera-profile menimpa nilai ini.
  # Profil dengan nir: true otomatis menyalakan simulate_nir (CLAHE di pipeline, bukan di simulasi).
  camera_profile: null
  face:
    model: mediapipe        # mediapipe (fase 1) | mtdms (fase 2, belum ada)
    model_path: models/mediapipe/face_landmarker.task
    max_side_px: 640
    min_detection_conf: 0.5
    min_presence_conf: 0.5
    min_tracking_conf: 0.5
    # Konvensi sumbu pose (cek sekali dengan tools/check_pose.py):
    #   yaw   > 0 = menoleh ke kanan pengemudi
    #   pitch < 0 = menunduk
    #   roll  > 0 = miring ke bahu kanan
    yaw_sign: 1
    pitch_sign: 1
    roll_sign: 1
    # Detektor wajah + crop SEBELUM Face Landmarker (src/cabin/face_crop.py). Untuk wajah kecil / di tepi
    # gambar / gelap (uji forklift 2026-11-23: "terlihat 0%"). Detektor YuNet (OpenCV, MIT, opencv_zoo):
    #   models/face/face_detection_yunet_2023mar.onnx  (sha256 8f2383e4dd3cfbb4...2552fa4, 232589 byte)
    crop:
      enabled: false
      detector: yunet
      yunet_model: models/face/face_detection_yunet_2023mar.onnx
      det_score: 0.6            # skor minimal YuNet
      det_max_side: 640         # gambar input detektor diperkecil ke sini
      min_face_px: 20           # kotak wajah lebih kecil diabaikan (koordinat gambar input)
      margin: 1.8               # sisi crop = margin x sisi terpanjang kotak wajah
      out_px: 320               # crop diubah ke ukuran ini sebelum Face Landmarker
      hold_shift: 0.12          # crop ditahan selama pusat wajah bergeser < 12% sisi crop
      hold_scale: 0.15          # ... dan ukuran berubah < 15%
      redetect_every: 0         # 0 = detektor hanya saat wajah hilang (pelacakan dari landmark)
      fallback_full: true       # detektor tidak menemukan wajah -> Face Landmarker di full frame (perilaku lama)
      lost_search_every: 1      # wajah hilang -> cari (YuNet + full frame) tiap N frame; 1 = tiap frame
  yolo:
    enabled: true
    backend: onnxruntime    # ultralytics (.pt/.onnx/.engine) | onnxruntime (.onnx) | tensorrt (Jetson)
    # cabin_v1: RunPod RTX 4090, 150 epoch, imgsz 640, ~26 ribu gambar publik (2026-11-14).
    # cabin_v0 (CPU, imgsz 416) disimpan di models/weights/archive/cabin_v0.*
    weights: models/weights/cabin_best.onnx
    imgsz: 640
    # Input YOLO HARUS sama dengan preprocessing training (grayscale 3ch + CLAHE), terlepas dari simulate_nir.
    # Dengan input RGB, model cabin_v0 memberi 'phone' palsu (mis. dasi). none = pakai gambar apa adanya.
    preprocess: nir         # nir | none
    every_n_frames: 2
    # async: frame tidak menunggu YOLO, hasil terbaru dipakai (D-06 3 s / D-10 15 s cukup lambat).
    # Hanya untuk live: hasil bergantung waktu, jadi replay harness tetap pakai false (deterministik).
    async: false
    async_max_fps: 5        # batas laju YOLO di mode async (0 = secepat mungkin); every_n_frames diabaikan
    class_names: [phone, helmet, head_no_helmet, vest, torso]
    providers: [CPUExecutionProvider]

front:
  enabled: false
  source:
    type: file
    # Laptop uji (2026-11-21): Logitech C930e = index 1 (0 = kamera bawaan). FOV diagonal ~90°.
    index: 1
    path: null
    url: null
    pipeline: null
    width: 1280
    height: 720
    fps: 30
    realtime: true
    api: dshow
    fourcc: MJPG            # tanpa ini C930e jatuh ke YUY2: 720p ~10 fps, 1080p ~5 fps
    autofocus: false        # kunci fokus: kalibrasi papan catur hanya berlaku untuk fokus yang sama
    focus: 0                # 0 = tak hingga (C930e: 0..255); jalur forklift jauh dari kamera
    # H.264 tersisip di frame MJPG oleh kamera sendiri (C930e, extension unit UVC H.264). Hanya Linux/V4L2
    # (Jetson). Ukuran & FPS mengikuti width/height/fps di atas. Gagal -> webcam MJPG biasa.
    h264_mux:
      enabled: false
      bitrate: 3000000        # bit/s; ~3 Mbps cukup untuk 720p dan muat di uplink 5G
      iframe_period_ms: 1000  # jarak keyframe yang diminta (kamera bisa memakai jarak lain saat FPS turun)
      profile: constrained_baseline
      unit_id: null           # null = cari otomatis dari deskriptor USB
  yolo:
    backend: ultralytics
    weights: models/weights/yolo11n.pt   # COCO pretrained; nanti front_best
    imgsz: 640
    tracker: bytetrack.yaml
    class_names: null        # null = pakai nama dari model
    person_class: person
  calibration: configs/front_camera.yaml
  # Simulasi kamera depan (mis. imx477_m12_75). Jika aktif, K/distorsi untuk jarak DITURUNKAN dari profil
  # (frame sudah di-crop/resize), blok `camera` di front_camera.yaml diabaikan; mount/distance tetap dipakai.
  camera_profile: null

camera_sim:
  profiles: configs/camera_profiles.yaml
  phone_hfov_deg: null      # null = phone.hfov_deg di camera_profiles.yaml; CLI --phone-hfov menimpa

alert:
  type: laptop_beep         # laptop_beep | gpio | none
  gpio_pin: 18
  beep_freq_hz: 2000
  beep_ms: 250

sink:
  file:
    enabled: true
    dir: events             # events/YYYY-MM-DD/events.jsonl
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic: forklift/{device_id}/events   # format topik final dari tim Minerva (pertanyaan terbuka #3)
    qos: 1
    spool_dir: events/_spool              # antrean lokal jika broker tidak tersambung
    # Status perangkat (Last Will retained: broker menerbitkan "offline" jika Jetson putus tanpa pamit)
    status_topic: forklift/{device_id}/status
    heartbeat_topic: forklift/{device_id}/heartbeat
    media_topic: forklift/{device_id}/media   # info snapshot/klip setelah selesai ditulis (nanti + URL unggah)
    keepalive_s: 30                           # broker menyatakan offline ~1,5x keepalive setelah putus
    username: null
    password_env: null                        # nama variabel lingkungan berisi kata sandi (bukan sandinya)

  # Dashboard MINERVA (impactto): proses CV -> gateway lokal (src/gateway) -> WebSocket ke dashboard.
  # Kontrak: impactto qa/uc2/jetson-scope.md. CLI --gateway menyalakannya tanpa mengubah file ini.
  gateway:
    enabled: false
    url: ws://127.0.0.1:8788
    forklift_id: FL-01
    retry_s: 2.0
    max_queue: 2000
    # Live kamera kabin ke dashboard (pesan `frame`). Wajah pengemudi secara live: kebijakan privasi
    # belum disepakati (pertanyaan terbuka #5) -> matikan di sini jika tidak boleh.
    live:
      enabled: true
      fps: 4
      max_side: 480         # ~20-30 KB/frame -> ~1 Mbps pada 4 fps
      jpeg_quality: 60
      overlay: false        # true = kirim gambar dengan overlay debug (sinyal, kode aktif)

# Proses gateway (python -m src.gateway.server), terpisah dari proses CV supaya CV restart/crash tidak
# memutus dashboard, seq, dan replay.
gateway:
  forklift_id: FL-01
  dashboard: {host: 0.0.0.0, port: 8787}     # dashboard: Pengaturan -> endpoint Jetson FL-01
  producer: {host: 127.0.0.1, port: 8788}    # hanya lokal: CV, GPS/zona, UPS
  state_dir: gateway_state                   # seq.txt, events.jsonl (buffer replay), log/ (JANGAN di-commit)
  replay_buffer: 500
  telemetry_s: 2
  status_fresh_s: 6                          # status CV lebih tua dari ini -> fpsCabin 0, cabinAlive false
  max_message_kb: 512
  # Frame live dibuang untuk dashboard yang buffer kirimnya > ini (5G lambat): alarm tidak antre di belakang
  # gambar. Di Linux, buffer kernel bisa menyembunyikan antrean; cek framesDropped di telemetri saat uji 5G.
  frame_drop_backlog_kb: 16
  replay_media_last: 50          # replay juga mengirim ulang info klip N event terakhir
  # Bukti kejadian (K7): snapshot/klip disajikan read-only lewat HTTP, URL-nya ikut di event
  # (snapshotUrl saat mulai; clipUrl lewat pesan `media` setelah klip selesai ditulis).
  media:
    enabled: true
    host: 0.0.0.0
    port: 8789
    root: events                 # = sink.file.dir proses CV; hanya .jpg/.mp4 di bawahnya yang bisa diambil
    public_base_url: null        # null = http://<host yang dipakai dashboard>:<port>

heartbeat:
  enabled: true
  interval_s: 2             # sama dengan telemetri dashboard (tanda hidup tiap 2 dtk)
  clock_check_s: 60         # cek NTP (timedatectl) tiap 60 s; null di Windows

recording:
  enabled: true
  pre_s: 10
  post_s: 5                 # dipakai jika clip_until: fixed
  # Brief MINERVA (2026-11-18): klip 10 s sebelum t0 sampai kondisi selesai, maks 60 s.
  clip_until: end           # end | fixed
  post_end_s: 2             # sesudah event end
  max_s: 60
  # Snapshot dari frame SEBELUM kondisi mulai (D-09: frame terakhir sebelum kamera tertutup)
  snapshot_before_condition_codes: [D09]
  snapshot_before_condition_s: 0.5
  fps: 15
  width: 1280               # frame lebih besar diperkecil
  jpeg_quality: 80
  ffmpeg: ffmpeg            # path ffmpeg; fallback ke encoder OpenCV jika tidak ada (mp4v: browser belum tentu bisa)
  # klip diunduh lewat uplink 5G yang sama dengan alarm -> batasi bitrate; thread encoder dibatasi agar FPS CV
  # tidak turun tajam setelah alarm (Orin Nano: x264 software, tanpa encoder hardware)
  x264_args: [-crf, "26", -maxrate, 1500k, -bufsize, 3000k, -threads, "2"]
  encoder_nice: 10          # Linux: encoder klip kalah prioritas dari loop deteksi (K5)

# Batas thread pustaka numerik (src/perf.py). null = bawaan pustaka (tiap pustaka ~1 thread per core).
# Di Jetson, thread pekerja OpenBLAS/OpenMP/OpenCV ikut berputar saat menunggu; ukur CPU+FPS dulu sebelum diisi.
threads:
  blas: null                # OpenBLAS (numpy, scipy)
  openmp: null              # libgomp
  opencv: null              # cv2.setNumThreads

# Rekaman kamera kabin terus-menerus untuk pengumpulan data (frame mentah dari kamera, SEBELUM simulate_nir,
# tanpa overlay). Segmen + <video>.ts.csv (frame,ts_ms) -> bisa diputar ulang lewat replay harness.
# Hanya peraga yang setuju direkam; simpan lokal, jangan commit/unggah (CLAUDE.md aturan 9 dan 11).
continuous_recording:
  enabled: false
  dir: recordings/cabin
  prefix: cabin
  segment_s: 300            # 5 menit per file
  fps: 10                   # cukup untuk anotasi/replay. Ukuran MJPG sangat tergantung noise: Jetson malam 960 px ~10 GB/jam
  max_side: 960
  # MJPG: murah di CPU, besar (Jetson 640 px ~3.7 GB/jam). H264: satu encode x264 (ffmpeg, nice) -> MP4
  # terfragmentasi, jauh lebih kecil; CPU x264 diukur dulu di perangkat sebelum dipakai.
  codec: MJPG
  ext: avi
  h264_ext: mp4
  ffmpeg: ffmpeg
  x264_args: [-preset, ultrafast, -crf, "28", -threads, "1"]
  encoder_nice: 10          # Linux: encoder kalah prioritas dari deteksi
  jpeg_quality: 85
  min_free_gb: 15           # berhenti merekam jika ruang disk kurang dari ini
  max_queue: 60             # frame antre ke thread penulis; penuh -> frame rekaman dibuang, deteksi tidak melambat

# Kamera depan TANPA deteksi (sumber = front.source): panel kedua di tampilan web + rekaman data.
# Dipakai selama pipeline depan (YOLO TensorRT + ByteTrack) belum jalan di Jetson. Jangan aktifkan bersamaan
# dengan front.enabled (kamera yang sama tidak bisa dibuka dua kali).
front_preview:
  enabled: false
  label: Kamera depan
  rotate: 0                 # 0/90/180/270 searah jarum jam, sesuai cara kamera dipasang
  retry_s: 5                # buka ulang kamera tiap 5 s jika tercabut
  # Deteksi depan (front.yolo + ByteTrack) di thread sendiri; kotak digambar di kanal web "front".
  # Event F-01..F-03 tetap tidak dikirim (events.yaml front_events_enabled, belum disepakati HSE GMF).
  detect:
    enabled: false
    fps: 10                 # batas atas inferensi depan; frame kamera di antaranya dilewati
    log_every_s: 5          # baris "[fps-depan] N FPS" di log (dibaca agent MINERVA -> fpsForward)
  recording:
    enabled: false
    dir: recordings/front
    prefix: front
    segment_s: 300
    fps: 10
    max_side: 1280
    # MJPG: frame didekode lalu di-encode ulang (cuplik `fps`). H264: aliran H.264 kamera disimpan apa adanya
    # (perlu front.source.h264_mux aktif + ffmpeg), SEMUA frame, ~4-5x lebih kecil, tanpa beban encode.
    # Kalau kamera tidak mengirim H.264, otomatis kembali ke MJPG (fps/max_side/jpeg_quality di atas).
    codec: MJPG
    ext: avi
    h264_ext: mp4             # MP4 terfragmentasi (tetap bisa dibuka walau proses mati di tengah segmen)
    ffmpeg: ffmpeg
    jpeg_quality: 85
    min_free_gb: 15
    max_queue: 60
  # Dorong H.264 kamera (perlu front.source.h264_mux) ke server RTSP, mis. MediaMTX di perangkat yang sama;
  # MediaMTX menyajikannya ke laptop (RTSP :8554 / WebRTC :8889 di browser). Tanpa encode ulang.
  # RTSP tidak membawa rotasi: penonton memutar sendiri sesuai `rotate` di atas.
  stream:
    enabled: false
    url: rtsp://127.0.0.1:8554/front
    transport: tcp            # tcp: tahan NAT/5G; udp hanya di LAN yang bersih
    retry_s: 5                # server belum jalan / putus -> coba lagi
    max_queue: 30             # penuh -> frame dibuang, tunggu keyframe berikutnya
    ffmpeg: ffmpeg

ui:
  show: true
  # judul jendela OpenCV
  window: "GMF AeroAsia - Forklift Safety AI - Kamera Kabin"
  window_front: "GMF AeroAsia - Forklift Safety AI - Kamera Depan"
  window_recorder: "GMF AeroAsia - Forklift Safety AI - Recorder Lembar A"
  window_pose: "GMF AeroAsia - Forklift Safety AI - Cek Pose"
  # Tampilan browser (MJPEG) + tombol hotkey: http://IP-PERANGKAT:port. Hanya jaringan lokal, tanpa login.
  # CLI --web PORT menyalakannya tanpa mengubah file ini.
  web:
    enabled: false
    port: 8090
    fps: 10                 # batas frame yang dikirim ke browser (pipeline tetap jalan penuh)
    max_side: 960
    jpeg_quality: 75
  # Jendela diperkecil jika frame lebih besar (mis. profil kamera 2304x1296). Hanya tampilan; model & klip tidak.
  display_max_side: 1280

model_versions:
  cabin: cabin_v1
  face: mediapipe-1.2
