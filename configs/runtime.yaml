# Konfigurasi runtime: sumber kamera, backend inferensi, keluaran alert.
# Fase 2 (Jetson): ganti cabin.source.type ke "gstreamer", backend ke "tensorrt", alert ke "gpio", sink ke MQTT Minerva.

device_id: laptop-dev
event_id_prefix: laptop
timezone_offset_h: 7        # WIB, untuk tanggal di event_id

cabin:
  source:
    type: webcam            # webcam | file | url | gstreamer
    index: 0
    path: null              # untuk type=file
    url: null               # untuk type=url (aplikasi IP camera di HP)
    pipeline: null          # untuk type=gstreamer (Jetson)
    width: 640
    height: 480
    fps: 30
    realtime: true          # file: putar sesuai timestamp asli (replay = live)
    api: auto               # webcam backend OpenCV: auto | dshow | msmf | v4l2
  simulate_nir: false       # grayscale 3 channel + CLAHE (aturan kerja 7)
  clahe_clip: 2.0
  clahe_tile: 8
  roi: null                 # [x, y, w, h] relatif 0..1 (crop kursi pengemudi); null = full frame
  # Uji live 2026-11-14: frame gelap saat webcam baru menyala (mean ~13) -> D-09 palsu di detik 3.
  # Indikator tetap dihitung, tapi tidak ada alert selama sekian detik pertama sumber kamera.
  startup_grace_s: 3.0
  # Simulasi kamera target dari kamera HP/webcam (configs/camera_profiles.yaml, docs/PHONE_CAMERA_TEST.md).
  # null = tanpa simulasi. Contoh: imx219_77ir, imx219_77ir+forklift. CLI --camera-profile menimpa nilai ini.
  # Profil dengan nir: true otomatis menyalakan simulate_nir (CLAHE di pipeline, bukan di simulasi).
  camera_profile: null
  face:
    model: mediapipe        # mediapipe (fase 1) | mtdms (fase 2, belum ada)
    model_path: models/mediapipe/face_landmarker.task
    max_side_px: 640
    min_detection_conf: 0.5
    min_presence_conf: 0.5
    min_tracking_conf: 0.5
    # Konvensi sumbu pose (cek sekali dengan tools/check_pose.py):
    #   yaw   > 0 = menoleh ke kanan pengemudi
    #   pitch < 0 = menunduk
    #   roll  > 0 = miring ke bahu kanan
    yaw_sign: 1
    pitch_sign: 1
    roll_sign: 1
  yolo:
    enabled: true
    backend: onnxruntime    # ultralytics (.pt/.onnx/.engine) | onnxruntime (.onnx) | tensorrt (Jetson)
    # cabin_v1: RunPod RTX 4090, 150 epoch, imgsz 640, ~26 ribu gambar publik (2026-11-14).
    # cabin_v0 (CPU, imgsz 416) disimpan di models/weights/archive/cabin_v0.*
    weights: models/weights/cabin_best.onnx
    imgsz: 640
    # Input YOLO HARUS sama dengan preprocessing training (grayscale 3ch + CLAHE), terlepas dari simulate_nir.
    # Dengan input RGB, model cabin_v0 memberi 'phone' palsu (mis. dasi). none = pakai gambar apa adanya.
    preprocess: nir         # nir | none
    every_n_frames: 2
    class_names: [phone, helmet, head_no_helmet, vest, torso]
    providers: [CPUExecutionProvider]

front:
  enabled: false
  source:
    type: file
    index: 1
    path: null
    url: null
    pipeline: null
    width: 1280
    height: 720
    fps: 30
    realtime: true
    api: auto
  yolo:
    backend: ultralytics
    weights: models/weights/yolo11n.pt   # COCO pretrained; nanti front_best
    imgsz: 640
    tracker: bytetrack.yaml
    class_names: null        # null = pakai nama dari model
    person_class: person
  calibration: configs/front_camera.yaml
  # Simulasi kamera depan (mis. imx477_m12_75). Jika aktif, K/distorsi untuk jarak DITURUNKAN dari profil
  # (frame sudah di-crop/resize), blok `camera` di front_camera.yaml diabaikan; mount/distance tetap dipakai.
  camera_profile: null

camera_sim:
  profiles: configs/camera_profiles.yaml
  phone_hfov_deg: null      # null = phone.hfov_deg di camera_profiles.yaml; CLI --phone-hfov menimpa

alert:
  type: laptop_beep         # laptop_beep | gpio | none
  gpio_pin: 18
  beep_freq_hz: 2000
  beep_ms: 250

sink:
  file:
    enabled: true
    dir: events             # events/YYYY-MM-DD/events.jsonl
  mqtt:
    enabled: false
    host: localhost
    port: 1883
    topic: forklift/{device_id}/events   # format topik final dari tim Minerva (pertanyaan terbuka #3)
    qos: 1
    spool_dir: events/_spool              # antrean lokal jika broker tidak tersambung

recording:
  enabled: true
  pre_s: 10
  post_s: 5
  fps: 15
  width: 1280               # frame lebih besar diperkecil
  jpeg_quality: 80
  ffmpeg: ffmpeg            # path ffmpeg; fallback ke encoder OpenCV jika tidak ada

ui:
  show: true
  # judul jendela OpenCV
  window: "GMF AeroAsia - Forklift Safety AI - Kamera Kabin"
  window_front: "GMF AeroAsia - Forklift Safety AI - Kamera Depan"
  window_recorder: "GMF AeroAsia - Forklift Safety AI - Recorder Lembar A"
  window_pose: "GMF AeroAsia - Forklift Safety AI - Cek Pose"
  # Jendela diperkecil jika frame lebih besar (mis. profil kamera 2304x1296). Hanya tampilan; model & klip tidak.
  display_max_side: 1280

model_versions:
  cabin: cabin_v1
  face: mediapipe-1.2
