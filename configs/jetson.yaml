# Overlay config untuk Jetson Orin Nano (Fase 2). Menimpa runtime.yaml/thresholds.yaml/events.yaml:
#   python -m src.main --overlay configs/jetson.yaml [--stdin-keys] [--log-fps 5]
# Threshold di sini SENGAJA belum diubah: kalibrasi ulang dengan rekaman gladi di forklift (CLAUDE.md bag. 9).

runtime:
  device_id: jetson-dev
  event_id_prefix: jetson
  cabin:
    source:
      type: gstreamer
      # IMX219 (CSI, sensor-id 0). Mode 1640x1232 = binning penuh -> FOV sensor penuh (4:3, wajah sampai dada).
      # nvvidconv (VIC, hardware) memperkecil ke 960x720 sebelum ke CPU: MediaPipe/YOLO memakai <= 640 px.
      # Uji 2026-11-16 di ruangan redup: auto-exposure memanjang -> FPS turun ke ~12 dan noise tinggi (est. 23).
      # exposuretimerange maks 33 ms (ns) menjaga 30 FPS (sisanya ditutup gain); tnr-mode 2 = pengurang noise ISP.
      pipeline: >-
        nvarguscamerasrc sensor-id=0 exposuretimerange="13000 33000000" gainrange="1 16"
        tnr-mode=2 tnr-strength=0.6 ee-mode=1 !
        video/x-raw(memory:NVMM),width=1640,height=1232,framerate=30/1 !
        nvvidconv ! video/x-raw,width=960,height=720,format=BGRx !
        videoconvert ! video/x-raw,format=BGR ! appsink drop=1 max-buffers=1
    # IMX219 NoIR (tanpa filter IR) di lampu ruangan -> warna magenta. Grayscale + CLAHE: sama dengan
    # preprocessing training YOLO dan dengan kamera NIR + lampu IR nanti di kabin.
    simulate_nir: true
    yolo:
      # tensorrt_native: TensorRT + cuda-python, tanpa torch. Di Jetson uji torch sistem crash (bus error)
      # pada operasi CUDA yang dipakai NMS Ultralytics, jadi backend `tensorrt` (Ultralytics) tidak bisa dipakai.
      # Engine di-build DI Jetson ini:
      #   /usr/src/tensorrt/bin/trtexec --onnx=models/weights/cabin_best.onnx --saveEngine=models/weights/cabin_best.trt --fp16
      #   python -m tools.wrap_trt_engine models/weights/cabin_best.trt models/weights/cabin_best.onnx models/weights/cabin_best.engine
      # Butuh: pip install "cuda-python>=12.6,<12.7" (versi CUDA JetPack).
      backend: tensorrt_native
      weights: models/weights/cabin_best.engine
      every_n_frames: 1
  continuous_recording:
    enabled: false          # data collection forklift uji 2026-11-22 selesai; nyalakan lagi saat di hangar
    dir: /home/jetson/gmf-forklift/recordings/cabin
    prefix: cabin
    # Uji 2026-11-22: 960 px ~10 GB/jam (gambar NoIR malam penuh noise -> JPEG besar). 640 px = ukuran input
    # MediaPipe/YOLO, cukup untuk data.
    max_side: 640
  front:
    enabled: false          # deteksi depan belum ada di Jetson (perlu YOLO TensorRT); kamera dipakai front_preview
    source:
      type: webcam
      index: 1              # C930e = /dev/video1 (IMX219 = video0 lewat Argus)
      api: v4l2
      fourcc: MJPG          # 720p 30 fps (15 fps saat gelap)
      width: 1280
      height: 720
      fps: 30
      autofocus: null       # biarkan bawaan kamera sampai dikalibrasi di posisi pasang final
      focus: null
      # Uji 2026-11-23: C930e di Jetson mengirim H.264 1280x720 Constrained Baseline tersisip di MJPG,
      # ~2.7 Mbps vs ~12 Mbps MJPG; dipakai rekaman tanpa encode ulang.
      h264_mux:
        enabled: true
        bitrate: 3000000
        iframe_period_ms: 1000
        profile: constrained_baseline
        unit_id: null
  front_preview:
    enabled: true
    # Uji 2026-11-22: C930e terpasang miring; 90 menghasilkan gambar terbalik -> 270 (berlawanan jarum jam).
    rotate: 270
    recording:
      enabled: false        # data collection 2026-11-22 selesai; nyalakan lagi saat di hangar
      dir: /home/jetson/gmf-forklift/recordings/front
      codec: H264           # simpan H.264 kamera apa adanya (MP4 + .ts.csv); MJPG otomatis jika H.264 tidak ada
    # H.264 kamera di-relay tanpa encode ulang ke MediaMTX (tools/jetson/mediamtx.sh di Jetson).
    # Tonton: http://IP-JETSON:8889/front (browser, WebRTC) atau rtsp://IP-JETSON:8554/front.
    # Nanti relay pindah ke server MINERVA: cukup ganti url ke rtsp://<server-minerva>:8554/<path>.
    stream:
      enabled: true
      url: rtsp://127.0.0.1:8554/front
  # Uji 2026-11-23 (src.main saja, 20 s): bawaan 168% CPU ~20.7 FPS | opencv 2: 129% ~19.5 FPS |
  # opencv 1: 107% ~18.2 FPS. Thread pool OpenCV berputar saat menunggu; OMP/OpenBLAS=1 tidak berpengaruh.
  threads:
    opencv: 2
  alert:
    type: none            # buzzer GPIO belum dipasang; ganti ke gpio setelah wiring (gpio_pin di runtime.yaml)
  ui:
    fullscreen: false
    web:
      enabled: true         # lihat & kendalikan dari browser laptop: http://IP-JETSON:8090
