# Overlay config untuk Jetson Orin Nano (Fase 2). Menimpa runtime.yaml/thresholds.yaml/events.yaml:
#   python -m src.main --overlay configs/jetson.yaml [--stdin-keys] [--log-fps 5]
# Threshold di sini SENGAJA belum diubah: kalibrasi ulang dengan rekaman gladi di forklift (CLAUDE.md bag. 9).

runtime:
  device_id: jetson-dev
  event_id_prefix: jetson
  cabin:
    source:
      type: gstreamer
      # IMX219 (CSI, sensor-id 0). Mode 1640x1232 = binning penuh -> FOV sensor penuh (4:3, wajah sampai dada).
      # nvvidconv (VIC, hardware) memperkecil ke 960x720 sebelum ke CPU: MediaPipe/YOLO memakai <= 640 px.
      # Uji 2026-11-16 di ruangan redup: auto-exposure memanjang -> FPS turun ke ~12 dan noise tinggi (est. 23).
      # exposuretimerange maks 33 ms (ns) menjaga 30 FPS (sisanya ditutup gain); tnr-mode 2 = pengurang noise ISP.
      # Uji forklift 2026-11-23 (15:25-16:00, luar ruangan): kamera menghadap terlalu tinggi; wajah di tepi
      # bawah, separuh gambar langit -> AE mengikuti langit, wajah gelap, MediaPipe "terlihat 0%". Kamera tidak
      # boleh dipindah (mengganggu pengemudi), jadi:
      #   aeregion  = AE hanya mengukur area pengemudi (koordinat sensor 1640x1232: kiri atas kanan bawah bobot)
      #   nvvidconv left/right/top/bottom = crop area pengemudi (4:3) dari sensor penuh -> wajah ~1,5x lebih besar
      # Uji forklift 2026-11-24 (rekaman 17:09:44, merem): wajah ~130 px di 960x720 -> mata ~15x5 px dan buram;
      # openness hanya turun ke 0,55-0,7 saat merem (ambang 0,30) -> D-01/D-02 tidak pernah aktif. Penyebab utama:
      # wajah terlalu kecil/buram (fokus lensa + arah kamera lebih menentukan daripada resolusi, uji webcam
      # tools/res_compare.py). OPSI (BELUM diuji di Jetson, ukur FPS dulu): mode penuh 3280x2464 (maks 21 fps),
      # crop sama (koordinat x2), keluaran 1440x1080 -> piksel wajah 1,5x per sisi; jika dipakai, set juga
      # continuous_recording.max_side: 1440:
      #   nvarguscamerasrc sensor-id=0 exposuretimerange="13000 33000000" gainrange="1 16"
      #   tnr-mode=2 tnr-strength=0.6 ee-mode=1 aeregion="900 1400 2380 2464 1.0" !
      #   video/x-raw(memory:NVMM),width=3280,height=2464,framerate=21/1 !
      #   nvvidconv left=530 right=2748 top=800 bottom=2464 !
      #   video/x-raw,width=1440,height=1080,format=GRAY8 ! appsink drop=1 max-buffers=1
      pipeline: >-
        nvarguscamerasrc sensor-id=0 exposuretimerange="13000 33000000" gainrange="1 16"
        tnr-mode=2 tnr-strength=0.6 ee-mode=1 aeregion="450 700 1190 1232 1.0" !
        video/x-raw(memory:NVMM),width=1640,height=1232,framerate=30/1 !
        nvvidconv left=265 right=1374 top=400 bottom=1232 !
        video/x-raw,width=960,height=720,format=GRAY8 ! appsink drop=1 max-buffers=1
      # GRAY8 langsung dari nvvidconv (VIC): tanpa videoconvert BGRx->BGR di CPU, lalu BGR->GRAY lagi di
      # simulate_nir. Uji 2026-11-23: capture 77% -> 53% CPU @30 fps, simulate_nir 2.3 -> 1.7 ms.
      # Luma GRAY8 = studio range 16..235 -> diregangkan ke 0..255 (nilai sama dengan jalur BGR lama).
      gray_range: limited
    # IMX219 NoIR (tanpa filter IR) di lampu ruangan -> warna magenta. Grayscale + CLAHE: sama dengan
    # preprocessing training YOLO dan dengan kamera NIR + lampu IR nanti di kabin.
    simulate_nir: true
    face:
      # Uji forklift 2026-11-23: wajah kecil di tepi bawah -> BlazeFace (jarak selfie) "terlihat 0%".
      # YuNet + crop sebelum Face Landmarker: snapshot forklift 0% -> 100% wajah (tools/face_bench).
      # Model: scp models/face/face_detection_yunet_2023mar.onnx (OpenCV >= 4.8 untuk FaceDetectorYN).
      crop:
        enabled: true
        lost_search_every: 3    # wajah hilang (menoleh, D-09, kursi kosong): cari tiap 3 frame (~100 ms)
        pose_fallback: true     # yaw/roll dari YuNet saat landmark gagal (wajah kecil di tepi bawah)
    yolo:
      async: true               # loop wajah tidak menunggu YOLO (D-06/D-10 lambat, cukup ~10 Hz)
      async_max_fps: 10
      # tensorrt_native: TensorRT + cuda-python, tanpa torch. Di Jetson uji torch sistem crash (bus error)
      # pada operasi CUDA yang dipakai NMS Ultralytics, jadi backend `tensorrt` (Ultralytics) tidak bisa dipakai.
      # Engine di-build DI Jetson ini:
      #   /usr/src/tensorrt/bin/trtexec --onnx=models/weights/cabin_v3_candidate.onnx --saveEngine=models/weights/cabin_v3_candidate.trt --fp16
      #   python -m tools.wrap_trt_engine models/weights/cabin_v3_candidate.trt models/weights/cabin_v3_candidate.onnx models/weights/cabin_v3_candidate.engine
      # Butuh: pip install "cuda-python>=12.6,<12.7" (versi CUDA JetPack).
      # cabin_v3 (2026-11-25) = cabin_v1 + data ponsel DMD (CC BY-NC-ND, khusus PoC non-komersial).
      # Gerbang vs cabin_v1: ponsel DMD (orang tak dilihat) recall 0.392 -> 0.975, FP-gambar 9.4% -> 1.1%;
      # data lama tidak turun. Belum diuji dengan kamera kabin asli -> cek D-06 di lapangan.
      # Kembali ke cabin_v1: weights: models/weights/cabin_best.engine (build dari cabin_best.onnx).
      backend: tensorrt_native
      weights: models/weights/cabin_v3_candidate.engine
      every_n_frames: 1
  continuous_recording:
    # Sesi gladi Lembar A berikutnya: rekaman mentah (tanpa overlay) + .ts.csv untuk replay harness.
    enabled: true
    dir: /home/jetson/gmf-forklift/recordings/cabin
    prefix: cabin
    # Uji 2026-11-22: 960 px ~10 GB/jam (malam, noise). Replay harus melihat gambar yang SAMA dengan live
    # (960x720, wajah kecil + crop wajah sensitif ukuran) -> 960, bukan 640. Berhenti sendiri jika disk < min_free_gb.
    max_side: 960
  recording:
    defer_event_start: true   # event langsung terkirim; snapshot/klip ditulis thread klip (K5)
    # Ring buffer klip menggambar overlay + JPEG tiap frame yang disimpan, walau tanpa event (~6 ms/frame).
    # 10 fps (bukan 15): CPU -1/3, klip tetap bisa diputar (K7).
    fps: 10
    # Uji 2026-11-24: klip ~1,1 Mbps (2 MB / 14 s) baru sampai server 19-50 s setelah event: sisa uplink 5G
    # di samping video live cuma ~0,5-1 Mbps. 960 px + maks 600 kbps -> ~1/2 ukuran, encode juga lebih ringan.
    # Snapshot ikut 960 px (frame buffer yang sama). Klip di bawah 1600 kbps diunggah agen edge apa adanya.
    width: 960
    x264_args: [-crf, "28", -maxrate, 600k, -bufsize, 1200k, -threads, "2"]
  front:
    enabled: false          # pipeline depan terpisah tidak dipakai; deteksi jalan di front_preview.detect
    # front_v2 (RunPod 2026-11-25) = front_v1 + kelas `box` (kardus, F-03 bahaya saat dekat). TensorRT FP16,
    # di-build DI Jetson ini (torch CUDA crash -> tensorrt_native):
    #   /usr/src/tensorrt/bin/trtexec --onnx=models/weights/front_v2.onnx --saveEngine=models/weights/front_v2.trt --fp16
    #   python -m tools.wrap_trt_engine models/weights/front_v2.trt models/weights/front_v2.onnx models/weights/front_v2.engine
    # Gerbang vs front_v1 (test publik, 2142 gambar): AP50 box 0.958 (recall 0.92), obstacle 0.678 vs 0.594,
    # person 0.758 vs 0.766 (dalam toleransi). Kardus asli belum diuji di 2-5 m -> cek di lapangan.
    # Kembali ke front_v1: weights: models/weights/front_best.engine (build dari front_best.onnx).
    # Kembali ke COCO: weights: models/weights/yolo11n.engine. ByteTrack numpy (src/backends/tracking.py).
    yolo:
      backend: tensorrt_native
      weights: models/weights/front_v2.engine
      track_fps: 10         # = front_preview.detect.fps (umur track ByteTrack dihitung per frame)
    source:
      type: webcam
      index: 1              # cadangan; nomor video berubah setelah reboot -> pakai `device`
      device: /dev/v4l/by-id/usb-046d_Logitech_Webcam_C930e_*-video-index0
      api: v4l2
      fourcc: MJPG          # 720p 30 fps (15 fps saat gelap)
      width: 1280
      height: 720
      fps: 30
      autofocus: null       # lewat v4l2_controls (CAP_PROP_FOCUS OpenCV tidak jelas skalanya di V4L2)
      focus: null
      # Uji 2026-11-24: gambar kadang blur = autofocus kontinu "berburu"; listrik Indonesia 50 Hz (bawaan 60 Hz
      # -> kedip lampu); dynamic framerate memperpanjang eksposur saat redup (motion blur). Fokus 0 = jauh
      # (C930e: tajam dari ~1 m sampai tak hingga), cocok untuk jalur forklift 2-10 m. Urutan penting.
      v4l2_controls:
        focus_automatic_continuous: 0
        focus_absolute: 0
        power_line_frequency: 1        # 50 Hz
        exposure_dynamic_framerate: 0
      # Uji 2026-11-23: C930e di Jetson mengirim H.264 1280x720 Constrained Baseline tersisip di MJPG,
      # ~2.7 Mbps vs ~12 Mbps MJPG; dipakai rekaman tanpa encode ulang.
      h264_mux:
        enabled: true
        # Uji 2026-11-24: 2 Mbps terlihat kasar saat bergerak -> kembali 3 Mbps. Aliran ini juga ke dashboard
        # lewat uplink 5G; jangan tonton /front lewat Tailscale bersamaan (uplink yang sama, ~5 Mbps).
        bitrate: 3000000
        iframe_period_ms: 1000
        profile: constrained_baseline
        unit_id: null
  front_preview:
    enabled: true
    # Uji 2026-11-22: C930e terpasang miring; 90 menghasilkan gambar terbalik -> 270 (berlawanan jarum jam).
    rotate: 270
    detect:
      enabled: true         # kotak orang di kamera depan (web + dashboard); tanpa event F-xx
      fps: 10
      decode_reduce: 2      # 720p -> 640x360 untuk YOLO (input 640); hemat ~8-10% satu core
      # Kotak deteksi -> agen edge (inbox lokal) -> server MINERVA -> dashboard, digambar di atas video
      # asli kamera (stream.urls). Agen edge tidak jalan -> dicoba lagi tiap 5 s, deteksi tidak terganggu.
      dets_url: http://127.0.0.1:8098/dets?cam=forward
    # Tampilan (web + overlay_stream): tiap frame kamera didekode dan diberi kotak deteksi terakhir,
    # jadi video depan halus walau deteksi 10 fps. 1 = 720p penuh (tajam), 2 = 640x360 (hemat CPU).
    # Uji 2026-11-24: 1 (720p penuh @ 20 fps) -> thread depan ~32% CPU dan FPS kabin turun ke ~11-20.
    view:
      decode_reduce: 2
    recording:
      enabled: false        # data collection 2026-11-22 selesai; nyalakan lagi saat di hangar
      dir: /home/jetson/gmf-forklift/recordings/front
      codec: H264           # simpan H.264 kamera apa adanya (MP4 + .ts.csv); MJPG otomatis jika H.264 tidak ada
    # H.264 kamera di-relay tanpa encode ulang (720p 30 fps, CPU ~1%) ke:
    #  - MediaMTX lokal (tools/jetson/mediamtx.sh): http://IP-JETSON:8889/front (Tailscale/Wi-Fi)
    #  - MediaMTX server MINERVA lewat SRT: dashboard memutar fl-01/front dan menggambar kotak (detect.dets_url)
    #    di browser. Video terputar (rotate) diputar oleh dashboard juga (rot ikut di pesan kotak).
    # Ke server MINERVA hanya saat ada penonton (on_demand): MediaMTX server memanggil runOnDemand ->
    # server -> agen edge -> POST :8090/stream?name=front (sewa 15 s, diperbarui). Uji 2026-11-24: uplink
    # 5G dipakai bersama klip kejadian; video depan 3 Mbps tanpa penonton membuat klip terlambat.
    stream:
      enabled: true
      urls:
        - rtsp://127.0.0.1:8554/front
        - url: srt://10.1.36.86:8890?streamid=publish:fl-01/front&pkt_size=1316&latency=300000
          on_demand: true
  # Uji 2026-11-23 (src.main saja, 20 s): bawaan 168% CPU ~20.7 FPS | opencv 2: 129% ~19.5 FPS |
  # opencv 1: 107% ~18.2 FPS. Thread pool OpenCV berputar saat menunggu; OMP/OpenBLAS=1 tidak berpengaruh.
  threads:
    opencv: 2
  alert:
    type: none            # buzzer GPIO belum dipasang; ganti ke gpio setelah wiring (gpio_pin di runtime.yaml)
  ui:
    # Jendela lokal (imshow + overlay tiap frame, X11) memakan CPU deteksi; di forklift tidak ada yang melihat
    # monitor Jetson. Tampilan lewat web :8090 / dashboard. Perlu monitor: live.sh start --show? -> set true.
    show: false
    fullscreen: false
    web:
      enabled: true         # lihat & kendalikan dari browser laptop: http://IP-JETSON:8090
    # Video beranotasi (overlay kabin + kotak deteksi depan) -> H.264 -> MediaMTX server MINERVA (LAN 5G).
    # Dashboard memutar WebRTC http://<server>:8889/<path> (mulus) alih-alih JPEG per frame lewat agen edge.
    # Uji 2026-11-24: x264 ultrafast 640x360@15 ~9% satu core Orin Nano. Server pindah -> ganti base_url.
    overlay_stream:
      enabled: true
      # SRT (UDP + kirim ulang): RTSP/TCP lewat uplink 5G macet tiap paket hilang (uji 2026-11-24).
      # MediaMTX server: srt: true, srtAddress :8890 (impactto jetson/mediamtx/mediamtx.yml).
      base_url: srt://10.1.36.86:8890
      # 800 ms: aliran ini kini bukti K7 (klip dipotong di server); paket yang tak terkirim ulang dalam
      # latency dibuang SRT -> gambar rusak tanpa celah waktu. Tampilan live sedikit lebih tertinggal.
      # Server: STREAM_DELAY_MS di impactto deploy/vps/streamclip.ts ikut nilai ini (+~0,5 s).
      srt_latency_ms: 800
      # Depan: video asli kamera (front_preview.stream) + kotak di browser, bukan encode ulang di sini.
      channels:
        cabin: fl-01/cabin
      fps: 20               # kabin ~22 FPS deteksi
      max_side: 960
      bitrate: 1200k
      bufsize: 600k
      gop_s: 1
      retry_s: 10
      # Server MINERVA merekam aliran ini (buffer 10 menit) dan memotong klip kejadian darinya tanpa unggah
      # tambahan; jam di gambar = waktu kejadian di klip (K7). Klip Jetson tetap cadangan.
      timestamp: true
