# Ambang semua indikator D-xx. Nilai awal dari Technical Spec bagian 4.
# Semua nilai di sini adalah NILAI AWAL dan harus di-tune dengan replay harness (eval/replay_eval.py).

signals:
  median_frames: 3            # median filter per sinyal (Tech Spec bag. 3)
  closed_openness_max: 0.30   # eye_closed jika openness < ini ...
  closed_blink_min: 0.50      # ... DAN blendshape blink > ini
  closed_logic: "and"         # "and" (sesuai spec) | "or" | "openness_only" | "blink_only"
  # Hysteresis (bukan dari spec; null = mati). Rekaman webcam 2026-11-14: pejam santai berayun di
  # openness 0.21-0.34 -> eye_closed putus-sambung -> D-02 baru aktif 2.7 s setelah mata tertutup.
  # Setelah tertutup, tetap tertutup selama openness < exit DAN blink > exit (mata terbuka: ~0.8-1.0 / ~0.2).
  closed_openness_exit: 0.45
  closed_blink_exit: 0.40
  mouth_open_jaw_min: 0.60
  # Fallback bukaan mulut (sinyal yawn_open) jika model wajah tidak memberi blendshape jawOpen:
  # yawn_open = MAR / ini (MAR = celah bibir dalam / lebar mulut). Menguap MAR ~0.5-0.9, bicara ~0.1-0.35.
  # Belum diukur di rekaman kita; MediaPipe sekarang selalu memberi jawOpen sehingga fallback tidak dipakai.
  mouth_mar_full: 0.9
  face_score_min: 0.50
  # eye_valid: rumus asli di Tech Spec terpotong saat ekspor PDF. Asumsi kita:
  # mata dianggap tidak bisa dibaca jika kepala menunduk terlalu dalam / menoleh terlalu jauh.
  eye_valid_pitch_down_max_deg: 25   # pitch < -25 -> eye_valid False (lihat catatan skenario 7 vs 9)
  eye_valid_yaw_max_deg: 45

calibration:
  duration_s: 5.0
  min_frames: 30
  max_ear_std: 0.04           # tolak kalibrasi jika EAR terlalu bervariasi
  max_pose_std_deg: 5.0
  population_ear_baseline: 0.28   # fallback jika belum dikalibrasi (EAR mata terbuka rata-rata populasi)
  max_attempts: 3             # setelah gagal sekian kali -> baseline populasi (hotkey c untuk ulang)
  max_abs_roll_deg: 15        # tolak pose "lurus" yang miring/menoleh/menunduk (relatif kamera)
  max_abs_yaw_deg: 25
  max_abs_pitch_deg: 35       # longgar: kamera kabin dipasang di bawah mata -> pitch mentah tidak nol
  # Sudut pasang kamera: pose wajah (mentah, relatif kamera) saat pengemudi menatap lurus ke depan. Batas
  # max_abs_* di atas dihitung RELATIF sudut ini, dan baseline populasi memakai sudut ini sebagai nol.
  # Kamera di pilar depan kanan -> isi mount_yaw_deg (cek tanda dengan tools/check_pose di posisi pasang).
  # Laptop/webcam depan wajah = 0. Diisi ulang saat pemasangan di forklift (Fase 2).
  mount_yaw_deg: 0.0
  mount_pitch_deg: 0.0
  mount_roll_deg: 0.0
  # Ganti pengemudi / pengemudi kembali setelah turun: wajah hilang >= sekian detik lalu muncul lagi ->
  # kalibrasi ulang otomatis (baseline lama tetap dipakai sampai kalibrasi baru berhasil). Harus > durasi
  # skenario tanpa wajah di Lembar A (D-09 lensa ditutup 15 s) agar tidak mengkalibrasi ulang di tengah uji.
  # null = mati.
  auto_recalibrate_after_absent_s: 20.0

D01_drowsy:
  window_s: 30
  perclos_min: 0.20
  slow_blink_s: [0.4, 1.4]
  slow_blink_count: 4
  min_valid_ratio: 0.7
  min_window_fill_s: 10       # jangan hitung PERCLOS sebelum ada minimal sekian detik data
  # "strict" = mata tertutup tanpa hysteresis (signals.closed_*_exit). Uji live 2026-11-14: dengan
  # hysteresis kedip normal 0.27 s memanjang jadi 0.40 s = "kedip lambat" -> D-01 palsu. "hysteresis" = lama.
  closed_signal: strict
  # Uji live 2026-11-14: 10 s setelah mulai, pejam terus (skenario 5) mengirim D-01 0,3 s SEBELUM D-02
  # karena PERCLOS = tertutup / waktu valid yang baru ~10 s. true = penyebut minimal window_s x min_valid_ratio.
  perclos_full_window: true

  # ---- Menguap -> menaikkan skor kantuk D-01 (BUKAN dari spec / Lembar A; permintaan user 2026-11-16)
  # Kode tetap D01 / A-02, tidak ada eskalasi ke A-03, tidak pernah memicu D02/D04/D05.
  # Skor kantuk = max(PERCLOS/perclos_min, kedip_lambat/slow_blink_count) + min(yawn_bonus_max, yawn_weight x N)
  # (N = jumlah menguap di yawn_window_s). Jalur PERCLOS/kedip lambat di atas tidak berubah sama sekali;
  # menguap hanya MENAMBAH jalur: D-01 aktif jika skor >= 1 (gerbang min_window_fill_s/min_valid_ratio
  # sama), atau N >= yawn_alone_count, dan HANYA selama yawn_active_hold_s setelah menguap terakhir.
  # Default ON: sinyal sintetis Lembar A tidak punya bukaan mulut -> 20 skenario identik (tests).
  # Pertanyaan terbuka: menguap bukan skenario Lembar A. Matikan (false) jika GMF minta uji KPI murni.
  yawn_enabled: true
  # Bukaan mulut (blendshape jawOpen 0..1). Bicara ~0.1-0.4, tertawa lebar sesaat ~0.5, menguap ~0.6-0.9
  # (perkiraan, BELUM diukur di rekaman kita -> tune dengan replay). Masuk >= min, bertahan selama >= exit.
  yawn_eye_mask: true          # mata terpejam saat menguap tidak masuk PERCLOS/kedip lambat (lihat D02 yawn_mask)
  yawn_eye_mask_release_s: 1.0
  yawn_open_min: 0.55
  yawn_open_exit: 0.40
  # Durasi bukaan lebar: bicara/tertawa < ~1 s per suku kata/tawa; menguap 2-6 s. > max = makan / mulut
  # menganga lama -> tidak dihitung. min konservatif 2.0 s agar tawa lebar tidak terhitung.
  yawn_min_s: 2.0
  yawn_max_s: 10.0
  # Celah yang tidak memutus satu menguap: data hilang (wajah hilang / tangan menutup mulut) <= gap_s;
  # bukaan turun di bawah exit <= dip_s (1-2 frame drop). dip_s kecil supaya suku kata bicara
  # (mulut tertutup 0.15-0.3 s di antaranya) tidak tersambung jadi satu bukaan panjang.
  # Bergantung FPS: 0.1 s = 2 frame di 30 FPS, tapi di 15 FPS drop 2 frame (0.13 s) sudah memutus
  # menguap. Menaikkan ke 0.15 berisiko menyambung suku kata bicara -> tune ulang di Jetson (FPS nyata).
  yawn_gap_s: 0.5
  yawn_dip_s: 0.1
  yawn_window_s: 300          # menguap dihitung dalam 5 menit terakhir
  # Bobot per menguap dan batasnya. bonus_max 0.4 < 1 -> menguap SAJA tidak pernah mencapai skor 1;
  # butuh bukti mata >= 0.6 (mis. PERCLOS >= 0.12). Satu menguap + mata ikut terpejam ~3 s
  # (PERCLOS ~0.14 -> 0.7) + 0.2 = 0.9 < 1 -> tidak memicu; kedip normal (PERCLOS ~0.05) + 0.4 = 0.65.
  yawn_weight: 0.2
  yawn_bonus_max: 0.4
  # Menguap berulang tanpa bukti mata: 3 dalam 5 menit = tanda lelah yang umum dipakai di literatur DMS.
  # Alarm palsu: bicara/tertawa tidak lolos yawn_min_s, jadi praktis hanya menguap sungguhan. null = mati.
  yawn_alone_count: 3
  # D-01 dari jalur menguap hanya aktif sekian detik setelah menguap terakhir (seperti
  # D04.nod_active_hold_s). Tanpa ini D-01 terbuka berMENIT-menit dan menutupi D-05/D-10 (prioritas lebih
  # rendah, satu event terbuka) -> kode salah di Lembar A (risiko K4).
  yawn_active_hold_s: 5.0

D02_long_closure:
  closed_s: 1.5
  face_gap_tolerance_s: 0.3
  # Menguap memejamkan mata -> tanpa mask, setiap menguap memicu D-02 A-03 (kode salah, risiko K4; rekaman
  # webcam uji_yawn_P1 2026-11-18: 3/3 menguap -> D-02). Selama mulut terbuka lebar (sinyal yawn_open, sama
  # dengan ambang menguap D-01) + release_s sesudahnya, pejaman tidak dihitung. Mikrotidur yang berlanjut
  # setelah mulut menutup tetap jadi D-02 (hitungan mulai lagi setelah mask lepas).
  yawn_mask:
    enabled: true
    open_min: 0.55            # = D01_drowsy.yawn_open_min
    open_exit: 0.40           # = D01_drowsy.yawn_open_exit
    release_s: 1.0

D04_head_drop:
  nod_drop_deg: 15
  nod_return_deg: 8
  nod_max_s: 2.0
  # Spec: 2. Diganti 3 (disetujui 2026-11-14): uji live webcam -> 2 lirikan ke bawah (keyboard/layar)
  # dalam 5 s memicu D-04 A-03 palsu (risiko K4 #2). Skenario 18 (30 s mengangguk) tetap >= 3 anggukan.
  nod_count: 3
  nod_window_s: 30
  # null = sesuai spec: D-04 tetap aktif selama >= nod_count anggukan masih di jendela 30 s
  #   (buzzer A-03 bisa berbunyi ~27 s setelah anggukan berhenti, event bisa terbawa ke skenario 19).
  # Opsi mitigasi: mis. 5.0 -> aktif hanya jika anggukan terakhir <= 5 s lalu.
  # Diaktifkan 5.0 (disetujui 2026-11-14): uji live -> buzzer A-03 berlanjut ~20 s setelah anggukan berhenti.
  nod_active_hold_s: 5.0
  roll_deg: 25
  roll_s: 1.5

D05_distraction:
  yaw_deg: 30
  pitch_down_deg: 25
  continuous_s: 1.5
  window_s: 6
  ratio: 0.5
  min_window_fill_s: 3.0      # akumulasi hanya dihitung setelah jendela berisi minimal sekian detik
  require_eyes_open: false    # Spesifikasi&Data: "dengan mata terbuka"; Tech Spec: tanpa syarat. Default = Tech Spec.
  # Mitigasi risiko K4 skenario 18 (anggukan terbaca D-05 duluan). OFF = sesuai spec.
  pitch_only_extra_hold_s: 0.0  # tambahan waktu tahan jika off-road HANYA karena pitch (mis. 1.0)
  # Bukan dari spec, dari rekaman webcam 2026-11-14 (skenario 9):
  # - lihat pangkuan biasa: pitch berayun -24..-28 di sekitar ambang 25 -> off-road putus-sambung.
  #   Setelah off-road, ambang dilonggarkan sebanyak ini sampai kepala benar-benar kembali.
  hysteresis_deg: 5.0
  # - lihat pangkuan dalam: wajah HILANG dari MediaPipe -> D-05 tidak pernah aktif.
  #   Jika wajah hilang tepat setelah off-road (dan kamera tidak terhalang), status off-road
  #   terakhir dipertahankan maksimal sekian detik. null = mati (spec).
  face_lost_offroad_hold_s: 5.0

D06_phone:
  # Spec awal 0.35. Di-tune pada split VALIDASI cabin_v0 (data publik, 137 ponsel):
  #   conf 0.35 -> recall 0.21, precision 0.45, FP 35 | conf 0.50 -> recall 0.18, precision 0.60, FP 17
  # cabin_v1 (GPU, 2026-11-14): kembali ke nilai spec 0.35 -> recall phone 0.42 di test publik.
  # Belum di-tune di split val v1 (data ada di pod). Cek alarm palsu D-06 secara live.
  conf: 0.35
  window_s: 1.0
  ratio: 0.6
  # Filter ponsel (src/cabin/phone_filter.py), 2026-11-16: buang `phone` yang tidak masuk akal untuk
  # pengemudi sebelum D-06. Satuan u = sisi terpanjang kotak wajah (landmark MediaPipe); dy > 0 = di bawah
  # pusat wajah. Angka awal dari log webcam lokal (cabin_v1, satu orang):
  #   ponsel asli (uji 15-16 Nov): |dx| <= 1,6 u, dy -0,35..0,94 u, ukuran 0,55-1,0 u, rasio sisi 1,1-2,9
  #   palsu tanpa ponsel (diag4): tepi kiri frame, dx -1,6..-3,1 u, ukuran 0,24-0,36 u
  #   palsu di wajah (mulut/dagu/janggut): pusat < 0,3 u dari tengah wajah, kotak di dalam kotak wajah
  # Wilayah sengaja longgar untuk Lembar A 12 (mengetik, dada/pangkuan), 13 (telinga), 14 (setinggi kemudi,
  # tertutup tangan). Kalibrasi ulang di Jetson dengan kamera kabin + rekaman gladi (posisi kamera berubah).
  filter:
    enabled: true
    conf: 0.35                  # conf minimal kandidat ponsel saat ada referensi wajah/kepala/torso
    max_dx_u: 2.2               # |pusat ponsel - pusat wajah| horizontal
    min_dy_u: -0.9              # di atas wajah lebih dari ini -> tolak
    max_dy_u: 4.0               # pangkuan masih masuk
    min_size_u: 0.3             # sisi terpanjang kotak ponsel / u (sebagian tertutup tangan masih >= ~0,4)
    max_size_u: 2.2
    max_aspect: 4.0             # sisi panjang / sisi pendek (ponsel miring di telinga ~3)
    inner_face:                 # kotak di tengah wajah = mulut/dagu/janggut, bukan ponsel
      rx_u: 0.30
      ry_u: 0.45
      min_ioa: 0.5              # >= 50% kotak ponsel di dalam kotak wajah
      max_abs_yaw_deg: 30.0     # hanya saat wajah menghadap kamera (profil: telinga bisa di tengah)
    face_memory_s: 5.0          # wajah hilang (menunduk ke ponsel, skenario 12) -> pakai kotak wajah terakhir
    ref_conf: 0.40              # conf kotak kepala/torso YOLO sebagai referensi cadangan
    head_box_scale: 0.85        # u dari kotak kepala/helm (kotak kepala lebih besar dari kotak landmark wajah)
    head_center_shift_u: 0.1
    torso_width_to_u: 0.55      # u dari lebar kotak torso
    torso_face_above_u: 0.7     # pusat wajah diperkirakan sekian u di atas tepi atas torso
    no_ref_conf: 0.55           # tanpa referensi apa pun: tidak ada aturan geometri, conf lebih tinggi
    no_ref_unit_frac: 0.25      # satuan stabilitas tanpa referensi = fraksi lebar frame
    track:
      min_hits: 2               # run YOLO berturut-turut (YOLO tiap 2 frame -> +~67 ms latensi di 30 FPS)
      max_gap_s: 0.5
      max_jump_u: 0.8           # lompatan pusat maksimum antar run agar dianggap ponsel yang sama
  # Pass kedua YOLO untuk ponsel di potongan area pengemudi (src/cabin/phone_crop.py), 2026-11-17.
  # cabin_v2 (data publik + hard negative) tidak menaikkan recall ponsel (0,42 -> 0,41 di test v1): ponsel di
  # frame penuh terlalu kecil setelah diperkecil ke 640. Potongan = wilayah filter (+ margin) dalam satuan u,
  # sehingga ponsel tampak lebih besar. Hanya kelas `classes` yang diambil dari potongan.
  # Biaya: satu inferensi YOLO tambahan per run YOLO (Jetson TensorRT ~22 ms; laptop CPU ~60 ms).
  # Berguna saat wajah relatif kecil di frame (kamera kabin wajah-sampai-dada); webcam dekat -> potongan ~ frame
  # penuh -> dilewati (min_gain). Detail baru hanya jika potongan >= ~640 px (tidak di-upscale).
  # Uji test publik cabin_v0 (88 gambar ponsel): potongan hanya terpakai di 3/359 gambar (foto publik bukan sudut
  # kabin) -> recall sama (0,298). Efek nyata harus diukur di rekaman/live sudut kabin.
  crop:
    enabled: true
    left_u: 2.6                 # filter max_dx_u 2.2 + margin setengah ponsel
    right_u: 2.6
    up_u: 1.2                   # filter min_dy_u -0.9 + margin
    down_u: 4.3                 # filter max_dy_u 4.0 + margin (pangkuan)
    min_gain: 1.25              # lewati jika sisi terpanjang potongan > frame/1,25 (tak ada keuntungan)
    min_side_px: 160
    face_memory_s: 5.0          # wajah hilang (menunduk ke ponsel) -> pakai kotak wajah terakhir
    merge_iou: 0.5              # duplikat frame penuh vs potongan -> simpan conf tertinggi
    classes: [phone]

D09_camera_block:
  # Spec awal std 10 / lap 20. Rekaman webcam 2026-11-14: telapak tangan dengan cahaya bocor di tepi
  # -> mean ~40, std ~18, lap_var 10-50 (scene normal: std ~65-80, lap_var ~600-950) -> spec tidak pernah aktif.
  # Tetap mensyaratkan wajah tidak terdeteksi. Kalibrasi ulang dengan kamera NIR di Jetson.
  std_max: 25
  lap_var_max: 60
  mean_min: 15
  mean_max: 240
  hold_s: 1.0
  downscale_px: 160           # frame diperkecil dulu agar murah dihitung
  # Lensa tertutup SEBAGIAN (src/cabin/camblock.py PartialBlock): grid sel, sel "tertutup" jika variansi
  # Laplacian-nya turun ke <= drop_ratio x baseline sel itu (baseline diambil saat wajah terlihat) atau sel
  # sangat gelap/terang. Sel yang baseline-nya sudah rata (< min_base_lap, mis. dinding polos) diabaikan.
  # Aktif jika fraksi sel tertutup >= frac_min DAN wajah tidak terdeteksi (syarat indikator D-09).
  # Nilai awal, BELUM dikalibrasi dengan rekaman; risiko alarm palsu: pengemudi keluar frame (uji di panduan).
  partial:
    enabled: true
    grid: [4, 4]
    downscale_px: 160
    drop_ratio: 0.25
    min_base_lap: 40
    min_cells: 4
    # 0.6 -> 0.45 (2026-11-18, SATU rekaman webcam P1 uji_yawn_P1): tutup 3/4 = 0.50-0.62, tutup 1/2 =
    # 0.25-0.50, keluar frame (kursi kosong) maks 0.19, gosok mata maks 0.12. Belum divalidasi orang/kamera lain.
    frac_min: 0.45
    baseline_alpha: 0.05
    warmup_frames: 15

D10_ppe:
  conf: 0.40
  window_s: 3.0
  ratio: 0.7
  vest_iou_max: 0.3           # torso tanpa vest = tidak ada vest dengan overlap >= ini

vehicle:
  require_moving: false       # true di operasi nyata; false saat uji KPI (pertanyaan terbuka #2)

front:
  person_conf: 0.35
  approach_speed_mps: 0.3     # mendekat jika jarak mengecil > ini
  speed_window_s: 1.0
  warning_zone_m: 6.0         # F-01 (usulan, belum disepakati HSE GMF)
  danger_zone_m: 3.0          # F-02 / F-03 (usulan)
