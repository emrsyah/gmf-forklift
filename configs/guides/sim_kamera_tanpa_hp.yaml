# Panduan rekaman untuk perbandingan profil kamera (tools/compare_profiles.py) + replay (eval/replay_eval.py).
# Tanpa skenario ponsel (HP dipakai sebagai kamera). ~4 menit, berhenti otomatis.
#   python -m tools.recorder --peraga P1 --session sim_P1c --source http://IP-HP:4747/video \
#       --guide configs/guides/sim_kamera_tanpa_hp.yaml --truth eval/scenarios/truth_sim.csv
# Langkah ber-`code` ditulis otomatis ke truth.csv. Kode A-02 yang sama diberi jarak >= 20 s (cooldown A-02),
# jadi tiap langkah bisa menghasilkan event sendiri. Teks ASCII saja (OpenCV putText).
# Catatan: tanpa helm/rompi, D-10 bisa aktif di jeda "normal" (prioritas terendah, tidak menutupi kode lain).
steps:
