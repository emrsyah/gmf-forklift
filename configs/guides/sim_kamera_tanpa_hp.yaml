  - {dur_s: 4,  say: "MENOLEH KE KIRI, tahan", code: D05, level: A-02, scenario: 10}
  - {dur_s: 8,  say: "Kembali tatap depan"}
  - {dur_s: 4,  say: "PEJAM MATA sambil SEDIKIT MENUNDUK", code: D02, level: A-03, scenario: 7}
  - {dur_s: 8,  say: "Tegak, buka mata"}
  - {dur_s: 4,  say: "LIHAT PANGKUAN, mata tetap TERBUKA", code: D05, level: A-02, scenario: 9}
