# CrowdHuman (.odgt) -> kelas kamera depan. Upstream hanya punya satu kelas: person (kotak vbox =
# bagian terlihat; tag "mask" dan extra.ignore=1 dibuang di front_sources.crowdhuman_to_yolo).
source: crowdhuman

map:
  person: [person]

labelled: [person]
subsets: []

derive:
  # Gambar CrowdHuman (jalanan, acara) berisi mobil/bus yang tidak dilabel -> isi dengan teacher COCO.
  teacher_fill: [gse_vehicle, aircraft_part]

group:
  # ID "273271,c9db..." : prefiks angka hanya batch crawl (beberapa ratus gambar tak terkait per prefiks),
  # bukan sekuens video -> tiap gambar satu grup; dHash menangkap near-duplicate.
  regex: []
  whole_source: false
