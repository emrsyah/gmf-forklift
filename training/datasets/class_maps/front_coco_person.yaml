# COCO 2017 (subset gambar berisi person) -> kelas kamera depan.
# COCO melabel semua 80 kelas secara lengkap, jadi kendaraan/pesawat ikut dipetakan supaya tidak
# dilatih sebagai latar. Pemetaan kendaraan = alias runtime di configs/front_camera.yaml
# (car/truck/bus -> gse_vehicle, airplane -> aircraft_part): gse_vehicle = kendaraan bermotor selain forklift.
source: coco_person

map:
  person: [person]
  car: [gse_vehicle]
  truck: [gse_vehicle]
  bus: [gse_vehicle]
  airplane: [aircraft_part]
  # Rintangan lantai untuk uji simulasi (kursi, cone, orang) + barang lepas di hangar. Harus dipetakan: COCO
  # melabel lengkap, jadi kursi yang tidak dipetakan dilatih sebagai LATAR dan bertentangan dengan ROD
  # (Chair -> obstacle). Sama dengan teacher_fill.map.obstacle dan alias runtime di front_camera.yaml.
  chair: [obstacle]
  bench: [obstacle]
  potted plant: [obstacle]
  suitcase: [obstacle]

labelled: [person, gse_vehicle, aircraft_part, obstacle]
subsets: []

derive:
  teacher_fill: []           # sudah dilabel lengkap

group:
  regex: []                  # foto Flickr independen; dHash menangkap duplikat
  whole_source: false
