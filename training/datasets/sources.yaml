# Sumber dataset publik untuk model YOLO kabin (Model 3, Tech Spec bag. 5).
# Semua sumber di sini bisa diunduh TANPA token. Lisensi: lihat LICENSES.md.
#
# Field umum:
#   enabled      : ikut di-download/di-build atau tidak
#   type         : hf_yolo_files | hf_coco_zip | hf_yolo_zip | coco_ultralytics | roboflow
#   class_map    : file di training/datasets/class_maps/
#   max_images   : batas gambar untuk build penuh (null = semua). --limit (smoke) menimpa ini.
#   download_mb  : perkiraan ukuran unduhan penuh (informasi saja)

sources:
  # Gabungan 2 dataset Kaggle: ds1 = andrewmvd/hard-hat-detection (helmet, head),
  # ds2 = construction-site-safety Roboflow (helmet, vest). Format YOLO per file.
  ppe_jhboyo:
    enabled: true
    type: hf_yolo_files
    repo: jhboyo/ppe-dataset
    revision: main
    splits: [train, val, test]          # folder upstream; split kita dibuat ulang (split.py)
    images_dir: images
    labels_dir: labels
    names: [helmet, head, vest]
    class_map: ppe_jhboyo.yaml
    max_images: 6000
    download_mb: 3000

  # Roboflow "ppe-detection-1" v2 (3x augmentasi per gambar asli -> wajib split per grup).
  ppe_vincent:
    enabled: true
    type: hf_yolo_files
    repo: VincentGOURBIN/ppe-detection
    revision: main
    splits: [train, valid, test]
    images_dir: images
    labels_dir: labels
    names: [helmet, no-helmet, no-vest, person, vest]
    class_map: ppe_vincent.yaml
    max_images: null
    download_mb: 220

  # Roboflow "construction-site-safety" v1 lewat roboflow2huggingface (zip COCO json).
  construction_keremberke:
    enabled: true
    type: hf_coco_zip
    repo: keremberke/construction-safety-object-detection
    revision: main
    zips: [data/train.zip, data/valid.zip, data/test.zip]
    class_map: construction_keremberke.yaml
    max_images: null
    download_mb: 28

  # COCO 2017: gambar yang berisi "cell phone" (kelas 67). Label YOLO dari rilis Ultralytics,
  # gambar diunduh satu per satu dari images.cocodataset.org (tanpa token).
  coco_phone:
    enabled: true
    type: coco_ultralytics
    labels_zip_url: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco2017labels.zip
    image_url_template: http://images.cocodataset.org/{split}/{name}
    splits: [train2017, val2017]
    require_class: 67                   # cell phone
    min_box_area_frac: 0.0005           # buang HP yang terlalu kecil (luas kotak / luas gambar)
    class_map: coco_phone.yaml
    max_images: null                    # ~4.800 gambar
    download_mb: 900

  # --- cabin_v2 (2026-11-16): tambahan untuk alarm palsu + recall `phone` ---------------------------
  # Negatif keras: COCO 2017 berisi orang + benda mirip ponsel di tangan/dekat wajah (remote, mouse,
  # buku, cangkir, botol, gunting, sikat gigi) dan TANPA cell phone. COCO melabel 80 kelasnya secara
  # lengkap -> tidak ada label cell phone = tidak ada ponsel (bukan sekadar "tidak dilabel").
  # Kepala/torso diisi pose-fill seperti coco_phone. Gambar yang oleh cabin_v1 terlihat ber-helm/rompi
  # dibuang (lihat screen di class_map) karena helm/rompi tidak dilabel di sumber ini.
  coco_lookalike:
    enabled: true
    type: coco_ultralytics
    labels_zip_url: https://github.com/ultralytics/assets/releases/download/v0.0.0/coco2017labels.zip
    image_url_template: http://images.cocodataset.org/{split}/{name}
    splits: [train2017, val2017]
    require_class: [39, 41, 64, 65, 73, 76, 79]   # bottle, cup, mouse, remote, book, scissors, toothbrush
    require_also: [0]                   # person (benda dipegang / dekat orang)
    exclude_classes: [67]               # cell phone
    min_box_area_frac: 0.002
    class_map: coco_lookalike.yaml
    max_images: 3000                    # ~10% data train (negatif terlalu banyak menekan recall phone)
    download_mb: 500

  # Positif ponsel: Open Images V7 "Mobile phone" (/m/050k8). Hanya gambar yang ponselnya menyentuh
  # kotak tangan atau dekat wajah (dipakai/dipegang), tanpa kotak group-of/depiction, tanpa helm,
  # tanpa rotasi. Anotasi CC BY 4.0; gambar terdaftar CC BY 2.0 (atribusi -> attribution.csv).
  openimages_phone:
    enabled: true
    type: openimages
    bbox_csv_url: https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-bbox.csv
    images_csv_url: https://storage.googleapis.com/openimages/2018_04/train/train-images-boxable-with-rotation.csv
    image_url_template: https://open-images-dataset.s3.amazonaws.com/train/{id}.jpg
    phone_label: /m/050k8
    hand_label: /m/0k65p                # Human hand
    face_label: /m/0dzct                # Human face
    skip_if_labels: [/m/0zvk5, /m/03p3bw, /m/07qxg_]   # Helmet, Bicycle helmet, Football helmet
    require_in_use: true
    near_face_widths: 1.5               # pusat ponsel <= 1,5 lebar wajah dari pusat wajah = "di telinga"
    min_box_area_frac: 0.002
    max_side_px: 1024
    class_map: openimages_phone.yaml
    max_images: 6000
    download_mb: 1500                   # + streaming CSV anotasi 2,3 GB dan daftar gambar 0,6 GB

  # DMD (Vicomtech Driver Monitoring Dataset, sesi distraksi s1/s2, kamera wajah + badan, RGB 1280x720):
  # frame "texting/phonecall" dengan kotak ponsel hasil auto-label YOLO-World (frame tanpa kotak dibuang ->
  # ponsel tersembunyi tidak diajarkan sebagai latar) + frame aksi lain sebagai negatif (radio, minum, dll).
  # Dibuat di pod oleh training/scripts/dmd_to_yolo.py -> data/manual/dmd_phone. Lisensi CC BY-NC-ND 4.0
  # (non-komersial; dipakai untuk PoC atas keputusan pengguna 2026-11-25). Folder tidak ada -> dilewati.
  dmd_phone:
    enabled: true
    type: local_yolo
    local_dir: data/manual/dmd_phone
    class_map: dmd_phone.yaml
    max_images: null
    download_mb: null

  # Foto ponsel di tangan (kecil, 57 gambar). Satu sesi -> satu grup.
  # NONAKTIF: cek visual menunjukkan sebagian kotak tidak pas dengan ponsel (mis. kotak di pergelangan
  # tangan / tepi keyboard). Aktifkan hanya setelah label dikoreksi di CVAT.
  cellphone_mahek:
    enabled: false
    type: hf_yolo_zip
    repo: MahekDharod/cellphone-detection-dataset
    revision: main
    zip: annotated_data.zip
    names_file: annotated_data/classes.txt
    class_map: cellphone_mahek.yaml
    max_images: null
    download_mb: 75

  # Contoh sumber Roboflow Universe (OPSIONAL). Hanya dipakai jika env ROBOFLOW_API_KEY ada.
  # Isi workspace/project/version sesuai dataset yang dipilih, lalu buat class_map-nya.
  roboflow_example:
    enabled: false
    type: roboflow
    workspace: CHANGE_ME
    project: CHANGE_ME
    version: 1
    export_format: yolov8
    class_map: roboflow_example.yaml
    max_images: null
    download_mb: null
