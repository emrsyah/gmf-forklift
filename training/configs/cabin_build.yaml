# Parameter pembangunan dataset YOLO kabin (L5). Dipakai oleh training/scripts/*.py.
# Path relatif dihitung dari root repo.

version: cabin_v2                       # versi data (Tech Spec bag. 7 langkah 8); cabin_v1 = 4 sumber pertama
classes: [phone, helmet, head_no_helmet, vest, torso]   # urutan = ID kelas (Tech Spec bag. 5)

paths:
  raw: data/raw                         # hasil download_public.py (per sumber, label upstream)
  work: data/cabin_work                 # merged/split berwarna (sementara)
  out: data/cabin                       # dataset final NIR: data/cabin/<version>/images|labels/<split>
  dataset_yaml: training/datasets/cabin.yaml
  sources: training/datasets/sources.yaml
  class_maps: training/datasets/class_maps
  pose_weights: data/weights/yolo11n-pose.pt
  pose_weights_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-pose.pt

download:
  workers: 8                            # unduhan paralel per file
  retries: 8                            # HF anonim bisa membalas 429 -> backoff + Retry-After
  timeout_s: 60
  seed: 0                               # pemilihan acak subset (max_images / --limit)

convert:
  image_ext: .jpg                       # semua gambar disimpan ulang sebagai JPG
  jpeg_quality: 95
  min_box_px: 4                         # kotak lebih kecil dari ini (sisi, piksel) dibuang
  drop_empty_images: false              # gambar tanpa label tetap dipakai (negatif)

# Mengisi label yang tidak ada di sumber dengan YOLO pose (COCO keypoints).
pose_fill:
  enabled: true
  device: null                          # null = otomatis (GPU jika ada)
  imgsz: 640
  conf: 0.35                            # confidence deteksi orang
  kp_conf: 0.5                          # keypoint dianggap terlihat jika conf >= ini
  batch: 16
  torso:
    # Kotak bahu-pinggul diperbesar supaya bentuknya mirip kotak rompi (IoU dengan vest >= 0,3
    # agar aturan runtime no_vest = torso tanpa vest IoU<0,3 konsisten). Dikalibrasi lewat
    # statistik "pose torso vs label torso" yang dicetak convert_to_yolo.py.
    pad_x: 0.25                         # x lebar bahu, ke kiri dan kanan
    pad_top: 0.10                       # x tinggi torso, di atas bahu
    pad_bottom: 0.10                    # x tinggi torso, di bawah pinggul
    height_per_shoulder_width: 1.5      # tinggi torso jika pinggul tidak terlihat (kamera kabin: wajah-dada)
    min_shoulder_width_px: 12
  head:
    min_points: 3                       # minimal keypoint wajah (hidung, mata, telinga) yang terlihat
    width_per_ear_dist: 1.35
    width_per_eye_dist: 2.6
    height_per_width: 1.25
    shift_up: 0.12                      # x tinggi kepala; pusat kepala di atas rata-rata titik wajah
    min_width_px: 10
  dedupe:
    torso_iou: 0.3                      # torso pose dibuang jika IoU >= ini dengan torso yang sudah ada
    head_ioa: 0.3                       # kepala pose dibuang jika >= 30% area-nya tertutup helmet/head yang ada
  stats_same_person_iou: 0.1            # statistik geometri: torso pose dianggap orang yang sama jika IoU > ini
  person_torso:                         # fallback torso dari kotak person (jika pose tidak menemukan torso di dalamnya)
    y0: 0.15                            # fraksi tinggi person, dari atas
    y1: 0.55
    x_margin: 0.08                      # fraksi lebar person, dipotong kiri-kanan
    min_height_frac: 0.15               # kotak person lebih kecil dari ini (fraksi gambar) tidak dipakai
    min_width_frac: 0.04
    min_aspect_h_w: 1.2                 # person harus lebih tinggi dari lebarnya (buang potongan tangan/lengan)

split:
  ratios: {train: 0.80, val: 0.10, test: 0.10}
  seed: 0
  dhash:
    enabled: true
    size: 8                             # dHash 8x8 = 64 bit
    max_hamming: 6                      # <= ini dianggap near-duplicate -> satu grup
    bands: 4                            # LSH: 4 pita x 16 bit
  hardlink: true                        # materialisasi split dengan hardlink (hemat disk)
  # Sumber cabin_v1: dibagi dengan algoritma yang sama HANYA di antara mereka -> split identik dengan
  # cabin_v1 (test v1 tetap tidak pernah dilatih). Sumber baru ditempel tanpa memindahkan file lama.
  # Kosongkan ([]) untuk perilaku lama (semua sumber dibagi bersama).
  anchor_sources: [ppe_jhboyo, ppe_vincent, construction_keremberke, coco_phone]
  warn_group_size: 200                  # peringatan jika satu grup akhir lebih besar dari ini

augment:
  enabled: true
  copies_per_image: 1                   # salinan augmentasi tambahan per gambar train
  seed: 0
  motion_blur: {p: 0.3, kernel: [3, 7]}
  gauss_noise: {p: 0.3, sigma: [5, 15]} # sigma dalam skala piksel 0-255
  gain: {p: 0.5, range: [0.4, 1.3]}     # gelap/terang multiplikatif
  face_cutout:
    p: 0.2
    height_frac: [0.10, 0.20]           # tinggi strip = 10-20% tinggi kotak kepala/helm
    # posisi pusat strip (fraksi tinggi kotak dari atas) per kelas:
    #   head_no_helmet: kotak = seluruh kepala -> dahi-mata ada di 15-60%
    #   helmet: kotak hanya cangkang helm -> dahi/mata tepat di bawah tepi bawah kotak (90-130%)
    region:
      head_no_helmet: [0.15, 0.60]
      helmet: [0.90, 1.30]
    classes: [helmet, head_no_helmet]
    fill: 0

nir:
  enabled: true                         # grayscale 3 channel + CLAHE (aturan kerja 7)
  runtime_config: configs/runtime.yaml  # clahe_clip/clahe_tile dibaca dari cabin.* di sini
  clahe_clip_default: 2.0               # dipakai hanya jika runtime.yaml tidak bisa dibaca
  clahe_tile_default: 8
