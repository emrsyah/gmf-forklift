# Parameter pembangunan dataset YOLO kamera DEPAN (Model 4, L9). Dipakai oleh
# training/scripts/build_front_dataset.py dan front_sources.py. Path relatif dihitung dari root repo.
# Kamera depan = RGB biasa -> TIDAK ada simulasi NIR di sini (beda dengan cabin_build.yaml).

version: front_v1
classes: [person, forklift, pallet_jack, gse_vehicle, aircraft_part, ladder_stand, obstacle]  # urutan = ID (Tech Spec bag. 6)

paths:
  raw: data/front_raw                   # terpisah dari data/raw (kabin) -> build kabin & depan tidak saling hapus
  work: data/front_work                 # merged sementara (dihapus setelah build kecuali --keep-work)
  out: data/front                       # dataset final: data/front/<version>/images|labels/<split>
  dataset_yaml: training/datasets/front.yaml
  sources: training/datasets/sources_front.yaml
  class_maps: training/datasets/class_maps

download:
  workers: 8
  retries: 8
  timeout_s: 60
  seed: 0                               # pemilihan subset (max_images / --limit)

convert:
  image_ext: .jpg
  jpeg_quality: 95
  min_box_px: 4                         # kotak lebih kecil (sisi, piksel gambar asli) dibuang
  max_side: 1920                        # gambar lebih besar diperkecil (Apron 3860x2160) -> hemat disk; label ternormalisasi tetap
  drop_empty_images: false              # gambar tanpa objek tetap dipakai sebagai negatif

# Kelas yang TIDAK dilabel oleh suatu sumber (class map -> labelled) akan menjadi "latar" saat training
# jika objeknya ada di gambar. Untuk kelas yang ada di COCO, isi dengan YOLO11n COCO (teacher) dan tandai
# pseudo. Hanya untuk kelas di derive.teacher_fill class map sumber itu.
teacher_fill:
  enabled: true
  weights: models/weights/yolo11n.pt
  imgsz: 640
  conf: 0.5                             # tinggi: lebih baik melewatkan orang daripada membuat label salah
  batch: 16
  device: null
  dedupe_iou: 0.5                       # buang pseudo jika IoU >= ini dengan kotak kelas sama yang sudah ada
  map:                                  # kelas kita <- nama kelas COCO (sama dengan alias runtime di configs/front_camera.yaml)
    person: [person]
    gse_vehicle: [car, truck, bus]
    aircraft_part: [airplane]
    obstacle: [chair, bench, potted plant, suitcase]   # rintangan uji simulasi; cone tidak ada di COCO (sumber ROD)

split:
  ratios: {train: 0.80, val: 0.10, test: 0.10}
  seed: 0
  hardlink: true
  dhash:
    enabled: true
    size: 8
    max_hamming: 6
    bands: 4
  # Aturan tetap (regex pada id grup "<source>:<grup>", urutan = prioritas) sebelum hash stabil.
  # LOCO hanya punya 5 lokasi (~18 sesi): split hash bisa membuat val/test tanpa forklift. Split per
  # LOKASI: subset-1 = val (sama dengan upstream), subset-4 = test, subset-2/3/5 = train.
  fixed:
    - {match: ':__nomatch__$', split: train}   # gambar yang regex grupnya gagal -> train (tidak pernah per frame)
    - {match: '^loco:subset-1(__|$)', split: val}
    - {match: '^loco:subset-4(__|$)', split: test}
    - {match: '^loco:subset-[235](__|$)', split: train}
    - {match: '^synthetic:', split: train}     # data sintetis tidak dipakai untuk mengukur
    # Apron: jika rilis punya folder split resmi (per sekuens) di bawah images/, pakai split resmi.
    - {match: '^apron:train(__|$)', split: train}
    - {match: '^apron:(val|valid|validation)(__|$)', split: val}
    - {match: '^apron:test(__|$)', split: test}
  warn_group_size: 2000                        # peringatan jika satu grup akhir lebih besar dari ini

augment:
  enabled: true
  copies_per_image: 1
  seed: 0
  motion_blur: {p: 0.3, kernel: [3, 7]}       # getaran forklift
  gauss_noise: {p: 0.3, sigma: [5, 15]}       # sensor di cahaya rendah
  gain: {p: 0.5, range: [0.4, 1.3]}           # shift malam, lampu hangar
  mast_strip:                                  # oklusi vertikal (tiang mast forklift), Tech Spec bag. 7
    p: 0.2
    width_frac: [0.05, 0.15]                   # lebar strip = 5-15% lebar gambar, setinggi gambar
    fill_gray: [20, 60]                        # mast = logam gelap
    drop_covered_frac: 0.6                     # kotak tertutup >= 60% lebarnya dibuang (tidak terlihat)
